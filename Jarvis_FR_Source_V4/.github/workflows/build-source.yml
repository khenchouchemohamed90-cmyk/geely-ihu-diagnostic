name: Vérification Jarvis FR Android 9
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'tools/**', 'analysis/SHA256_MODELE_FR.txt', '.github/workflows/build-source.yml']
  pull_request:
    paths: ['android/**', 'tools/**', 'analysis/SHA256_MODELE_FR.txt']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Vérifier le modèle et les tests simulés
        run: |
          python3 tools/verify_model.py
          sh tools/test_parser.sh
      - name: Compiler et contrôler Android
        run: cd android && ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisFR-diagnostic-Android9
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.*
