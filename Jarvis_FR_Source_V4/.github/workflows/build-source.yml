name: Verification du projet source Jarvis FR
on:
  workflow_dispatch:
  push:
    paths: ['android/**']
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Tester les commandes françaises, les doublons et l’ECARX simulé
        run: sh tools/test_parser.sh
      - name: Vérifier la syntaxe Java (interfaces Android simulées)
        run: python3 tools/check_android_sources.py
      - name: Compiler Android (lecture seule)
        run: cd android && gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisFR-source-base-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
