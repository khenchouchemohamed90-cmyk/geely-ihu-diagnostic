name: AZ Voice - Compiler APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'AZVoice_IHU007B_StandaloneBuild_project%20.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: unzip -oq 'AZVoice_IHU007B_StandaloneBuild_project .zip' -d .
        run: |
          set -euo pipefail
          unzip -oq 'AZVoice_IHU007B_StandaloneBuild_project%20.zip' -d .
          test -f settings.gradle
          test -f app/build.gradle

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer les outils et le SDK Android 34
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/az-android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fL --retry 3 -o "$RUNNER_TEMP/android-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $RUNNER_TEMP/android-tools.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-34' 'build-tools;34.0.0'

      - name: Installer Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ajouter le modele vocal francais
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/fr.zip" \
            https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          mkdir -p "$RUNNER_TEMP/model" app/src/main/assets/model-fr
          unzip -q "$RUNNER_TEMP/fr.zip" -d "$RUNNER_TEMP/model"
          cp -a "$RUNNER_TEMP/model/vosk-model-small-fr-0.22/." app/src/main/assets/model-fr/
          printf 'fr-0.22-standalone-1\n' > app/src/main/assets/model-fr/uuid
          test -f app/src/main/assets/model-fr/am/final.mdl

      - name: Compiler AZ Voice
        run: gradle --no-daemon :app:assembleDebug

      - name: Fournir APK
        uses: actions/upload-artifact@v4
        with:
          name: AZVoice-IHU007B-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
