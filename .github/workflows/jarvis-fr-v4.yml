name: Vérification Jarvis FR Android 9
on:
  workflow_dispatch:
  push:
    paths: ['Jarvis_FR_Source_V4/**', '.github/workflows/jarvis-fr-v4.yml']
  pull_request:
    paths: ['Jarvis_FR_Source_V4/**']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: Jarvis_FR_Source_V4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Utiliser le SDK Android préinstallé du runner
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          "$sdk_manager" --sdk_root="$sdk_root" --install 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Vérifier le modèle et les tests simulés
        run: |
          mkdir -p reports
          python3 tools/verify_model.py | tee reports/model-verification.json
          sh tools/test_parser.sh | tee reports/tests.txt
          sh tools/test_audio.sh | tee reports/tests-audio.txt
          sh tools/test_tts.sh | tee reports/tests-tts.txt
          sh tools/test_diagnostics.sh | tee reports/tests-diagnostics.txt
      - name: Produire les réponses françaises embarquées (obligatoires)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak
          python3 tools/generate_french_replies.py | tee reports/reponses-francaises.txt
          test -s android/app/src/main/assets/jarvis_replies/bonjour.wav
          test -s android/app/src/main/assets/jarvis_replies/inconnu.wav
      - name: Charger Vosk sous Linux et vérifier le rejet du silence
        run: |
          python3 -m venv "$RUNNER_TEMP/jarvis-vosk"
          "$RUNNER_TEMP/jarvis-vosk/bin/python" -m pip install --disable-pip-version-check vosk==0.3.45
          "$RUNNER_TEMP/jarvis-vosk/bin/python" tools/test_vosk_host.py --report reports/vosk-host.json
      - name: Compiler assembleDebug et contrôler Android
        run: |
          cd android
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug 2>&1 | tee ../reports/compilation.log
      - name: Vérifier la signature Android 9 et le modèle dans l’APK
        run: python3 tools/verify_apk.py | tee reports/apk-verification.json
      - name: Publier l’APK de diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: JarvisFR-diagnostic-Android9
          path: Jarvis_FR_Source_V4/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publier les rapports de vérification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JarvisFR-rapports-verification
          path: |
            Jarvis_FR_Source_V4/reports/**
            Jarvis_FR_Source_V4/android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30
